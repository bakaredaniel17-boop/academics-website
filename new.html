<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<title>Document</title>
     <link rel="stylesheet" href="assets/css/calculator.css">
</head>
<body>
 <section class="home">
          <div class="input" >
               <input type="text" readonly placeholder="0" id="display">
          </div>

          
          <div class="btns">
               <button class="btn1" onclick="clearDisplay('AC')">AC</button>
               <button class="btn2" onclick="deleteValue() ">DEL</button>
               <button class="btn3" onclick="('%')">%</button>
               <button class="btn4" onclick="append('*')">*</button>
               <button class="btn5" onclick="append('7')">7</button>
               <button class="btn6" onclick="append('8')">8</button>  
               <button class="btn7" onclick="append('9')">9</button>
               <button class="btn8" onclick="append('-')">-</button>
               <button class="btn9" onclick="append('6')">6</button>
               <button class="btn10" onclick="append('5')">5</button>
               <button class="btn11" onclick="append('4')">4</button>
               <button class="btn12" onclick="append('+')">+</button>
               <button class="btn13" onclick="append('1')">1</button>
               <button class="btn14" onclick="append('2')">2</button>
               <button class="btn15" onclick="append('3')">3</button>
               <button class="btn16" onclick="calculateResult('=')">=</button>
               <button class="btn17" onclick="append('0')">0</button>
               <button class="btn18" onclick="append('.')">.</button>
          </div>
     </section>
     <script src="assets/js/new.js"></script>
</body>
</html>
